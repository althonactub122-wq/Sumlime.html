<!DOCTYPE html>
<html>
<head>
<title>Sublime Shop</title>
<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f5f5f5;
}

header {
  background: black;
  color: white;
  padding: 15px;
  text-align: center;
  font-size: 28px;
  font-weight: bold;
}

.shop {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 15px;
  padding: 15px;
}

.product {
  background: white;
  border-radius: 10px;
  padding: 10px;
  text-align: center;
  box-shadow: 0 3px 8px rgba(0,0,0,0.1);
}

.product img {
  width: 100%;
  border-radius: 8px;
}

button {
  background: black;
  color: white;
  border: none;
  padding: 8px 12px;
  border-radius: 6px;
  cursor: pointer;
}

button:hover {
  background: #ff0055;
}

/* Order Form */
.order-box {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.6);
  display: none;
  justify-content: center;
  align-items: center;
}

.order-content {
  background: white;
  padding: 20px;
  border-radius: 10px;
  width: 300px;
}

input, select {
  width: 100%;
  padding: 8px;
  margin: 5px 0;
}

.close {
  background: red;
}
</style>
</head>
<body>

<header>🔥 SUBLIME MEGA SHOP 🔥</header>

<div class="shop" id="shop"></div>

<!-- ORDER FORM -->
<div class="order-box" id="orderBox">
  <div class="order-content">
    <h3>Order Details</h3>
    <p id="productName"></p>
    <p>Price: ₱<span id="productPrice"></span></p>

    <input id="buyerName" placeholder="Your Name">
    <input id="buyerAddress" placeholder="House Address">
    <input id="buyerPhone" placeholder="Phone Number">

    <select id="payment">
      <option>GCash</option>
      <option>Cash on Delivery (COD)</option>
      <option>Bank Transfer</option>
    </select>

    <button onclick="submitOrder()">Buy Now</button>
    <button class="close" onclick="closeOrder()">Cancel</button>
  </div>
</div>

<script>
let products = [];
let shopDiv = document.getElementById("shop");

// Generate 50+ random products
for(let i=1; i<=60; i++){
  let price = Math.floor(Math.random()*300)+200;
  let type = (i % 2 == 0) ? "T-Shirt" : "Jersey Pants";
  products.push({
    name: "Sublime " + type + " #" + i,
    price: price,
    img: "https://picsum.photos/200?random=" + i
  });
}

// Show products
products.forEach(p => {
  let div = document.createElement("div");
  div.className = "product";
  div.innerHTML = `
    <img src="${p.img}">
    <h4>${p.name}</h4>
    <p>₱${p.price}</p>
    <button onclick="buyNow('${p.name}', ${p.price})">Buy Now</button>
  `;
  shopDiv.appendChild(div);
});

let selectedProduct = "";

// Buy Now
function buyNow(name, price){
  selectedProduct = name;
  document.getElementById("productName").innerText = name;
  document.getElementById("productPrice").innerText = price;
  document.getElementById("orderBox").style.display = "flex";
}

function closeOrder(){
  document.getElementById("orderBox").style.display = "none";
}

// Submit Order (Demo only)
function submitOrder(){
  let name = document.getElementById("buyerName").value;
  let address = document.getElementById("buyerAddress").value;
  let phone = document.getElementById("buyerPhone").value;
  let payment = document.getElementById("payment").value;

  alert(
    "ORDER RECEIVED!\n\n" +
    "Product: " + selectedProduct + "\n" +
    "Name: " + name + "\n" +
    "Address: " + address + "\n" +
    "Phone: " + phone + "\n" +
    "Payment: " + payment
  );

  closeOrder();
}
</script>

</body>
</html>
